worker_processes auto;

events {
	worker_connections 1024;
}

http {
	map $http_upgrade $connection_upgrade {
		default upgrade;
		"" close;
	}

	server {
		listen 80;
		server_name knives.localhost;

		# cmd/api は r.Route("/api", ...) でパス込みのルーティングをしているため、
		# proxy_pass にURIを付けずそのまま転送する(パスを書き換えない)。
		location /api/ {
			proxy_pass http://api:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Vite devサーバ(base: "/app/")。HMRのWebSocketをアップグレードする。
		location /app/ {
			proxy_pass http://web:5173;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
		}

		# それ以外は全て短縮URLのリダイレクト解決(cmd/redirect)。
		location / {
			proxy_pass http://redirect:8081;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
